plugins {
    id 'com.android.application'
}

android {
    namespace 'com.radiocaribe.tuner'
    compileSdk 33

    defaultConfig {
        applicationId 'com.radiocaribe.tuner'
        minSdk 23
        targetSdk 23
        versionCode 34
        versionName '0.34'
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    dependencies {
        implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
        implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    }

    buildTypes {
        release {
            // Use the same cached signing certificate as legacy debug APKs so
            // upgrades over an existing Moto G3 installation remain possible.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}
