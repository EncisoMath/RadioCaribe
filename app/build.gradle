plugins {
    id 'com.android.application'
}

android {
    namespace 'com.radiocaribe.tuner'
    compileSdk 28

    defaultConfig {
        applicationId 'com.radiocaribe.tuner'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    def stableKeystore = file('../radiocaribe-debug.jks')

    signingConfigs {
        stableDebug {
            if (stableKeystore.exists()) {
                storeFile stableKeystore
                storePassword 'radiocaribe'
                keyAlias 'radiocaribe'
                keyPassword 'radiocaribe'
            }
        }
    }

    buildTypes {
        debug {
            if (stableKeystore.exists()) {
                signingConfig signingConfigs.stableDebug
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
