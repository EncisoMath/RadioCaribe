plugins {
    id 'com.android.application'
}

android {
    namespace 'com.radiocaribe.tuner'
    compileSdk 28

    defaultConfig {
        applicationId 'com.radiocaribe.tuner'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
