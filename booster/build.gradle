plugins {
    id 'com.android.application'
}
android {
    namespace 'com.radiocaribe.booster'
    compileSdk 33
    defaultConfig {
        applicationId 'com.radiocaribe.booster'
        minSdk 23
        targetSdk 28
        versionCode 30
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
