name: Restore archived RadioCaribe v0.32, v0.33 and v0.35 APKs
on:
  push:
    paths: [".github/workflows/restore-v032-release.yml"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Restore original v0.32, v0.33 and v0.35 signed APKs from successful builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v032"
          gh run download 43721384092 \
            --repo "$GITHUB_REPOSITORY" \
            --name "RadioCaribe-v0.32-APK" \
            --dir "$RUNNER_TEMP/v032"
          test -s "$RUNNER_TEMP/v032/RadioCaribe_v0.32.apk"
          gh release upload v0.32 "$RUNNER_TEMP/v032/RadioCaribe_v0.32.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p "$RUNNER_TEMP/v033"
          gh run download 43725794842 \
            --repo "$GITHUB_REPOSITORY" \
            --name "RadioCaribe-v0.33-APK" \
            --dir "$RUNNER_TEMP/v033"
          test -s "$RUNNER_TEMP/v033/RadioCaribe_v0.33.apk"
          gh release upload v0.33 "$RUNNER_TEMP/v033/RadioCaribe_v0.33.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p "$RUNNER_TEMP/v035"
          gh run download 43729540577 \
            --repo "$GITHUB_REPOSITORY" \
            --name "RadioCaribe-v0.35-APK" \
            --dir "$RUNNER_TEMP/v035"
          test -s "$RUNNER_TEMP/v035/RadioCaribe_v0.35.apk"
          gh release upload v0.35 "$RUNNER_TEMP/v035/RadioCaribe_v0.35.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Original v0.32, v0.33 and v0.35 APK releases restored"
