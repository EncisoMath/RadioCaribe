name: Build RC Booster Module Helper
on:
  push:
    branches: ["feature/magisk-adjustable-booster-v030"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android tools
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5.1"
      - name: Build signed booster controller
        run: gradle :booster:assembleDebug --stacktrace
      - name: Copy controller
        run: cp booster/build/outputs/apk/debug/booster-debug.apk RCBoosterController.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RCBoosterController-Android9-signed
          path: RCBoosterController.apk
          if-no-files-found: error
