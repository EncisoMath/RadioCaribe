name: Build RadioCaribe APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 28 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5.1"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RadioCaribe_v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioCaribe-v0.1-APK
          path: RadioCaribe_v0.1.apk
          if-no-files-found: error
