name: Build and Release RadioCaribe APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: radiocaribe-debug-keystore-v1

      - name: Java 11 for Android Gradle Plugin 7.4
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5.1"

      - name: Build signed installable release APK
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify signed APK and native FM library
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep "lib/armeabi-v7a/libfmjni.so"
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --verbose "$APK"
          cp "$APK" RadioCaribe_v0.32.apk
          sha256sum RadioCaribe_v0.32.apk

      - name: Upload installable APK to Actions
        uses: actions/upload-artifact@v4
        with:
          name: RadioCaribe-v0.32-APK
          path: RadioCaribe_v0.32.apk
          if-no-files-found: error

      - name: Publish APK in GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          RadioCaribe v0.32 — Moto G3 (Android 9 / LineageOS).
          
          - Internet radio now plays on any active media output: wired headphone,
            wired headset, USB, Bluetooth, or phone speaker (no jack required).
          - Automatically restores the active route's music volume to its system
            maximum (typically 25/25 on this Moto G3), including after a route
            change and via a periodic four-second check.
          - Internet streams receive a persistent +10 dB LoudnessEnhancer.
          - ExoPlayer manages internet-stream audio focus and releases it
            correctly on stop, reconnect or station change.
          - Preserves the rooted physical FM route and existing web administration.
          
          CAUTION: Maximum system volume plus +10 dB can be extremely loud on
          headphones, Bluetooth speakers or the phone speaker. Turn down the
          connected amplifier BEFORE installing and testing. Boosting may cause
          distortion on already-loud streams. The app does not increase analog
          hardware gain beyond Android's system limit.
          
          APK is the release variant signed with the project's cached update
          certificate (the same debug-signing configuration used by previous builds).
          Existing-app updates require matching signing certificates.
          EOF
          if gh release view "v0.32" >/dev/null 2>&1; then
            gh release upload "v0.32" RadioCaribe_v0.32.apk --clobber
          else
            gh release create "v0.32" RadioCaribe_v0.32.apk \
              --title "RadioCaribe v0.32 — Universal Audio +10 dB" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi

      - name: Remove old feature and fix branches after successful release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' |
            while IFS= read -r branch; do
              if [ -n "$branch" ] && [ "$branch" != "main" ]; then
                echo "Removing obsolete branch: $branch"
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              fi
            done
