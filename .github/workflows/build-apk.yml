name: Build RadioCaribe APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 28 SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-28" "build-tools;28.0.3"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: radiocaribe-debug-keystore-v1

      - name: Java 11 for Android Gradle Plugin 7.4
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5.1"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RadioCaribe_v0.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioCaribe-v0.3-APK
          path: RadioCaribe_v0.3.apk
          if-no-files-found: error
