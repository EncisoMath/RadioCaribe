name: Build RadioCaribe APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore embedded station logos
        run: |
          mkdir -p /tmp/radiocaribe-logos app/src/main/res/drawable-nodpi
          cat \
            assets/logo_pack.part00.b64 \
            assets/logo_pack.part01.b64 \
            assets/logo_pack.part02.b64 \
            assets/logo_pack.part03.b64 \
            assets/logo_pack.part04a.b64 \
            assets/logo_pack.part04b.b64 \
            assets/logo_pack.part04c.b64 \
            assets/logo_pack.part05a.b64 \
            assets/logo_pack.part05b.b64 \
            | tr -d '\n\r ' | base64 -d > /tmp/radiocaribe-logos.zip
          unzip -t /tmp/radiocaribe-logos.zip
          unzip -o /tmp/radiocaribe-logos.zip -d /tmp/radiocaribe-logos
          cp "/tmp/radiocaribe-logos/RADIO TIEMPO.jpg" app/src/main/res/drawable-nodpi/radio_tiempo.jpg
          cp "/tmp/radiocaribe-logos/OLIMPICABAQ.jpg" app/src/main/res/drawable-nodpi/olimpica_baq.jpg
          cp "/tmp/radiocaribe-logos/OLIMPICASMR.jpg" app/src/main/res/drawable-nodpi/olimpica_smr.jpg
          cp "/tmp/radiocaribe-logos/LA REINA.jpg" app/src/main/res/drawable-nodpi/la_reina.jpg
          cp "/tmp/radiocaribe-logos/MIX.jpg" app/src/main/res/drawable-nodpi/mix.jpg
          cp "/tmp/radiocaribe-logos/CANDENTE.jpg" app/src/main/res/drawable-nodpi/candente.jpg
          cp "/tmp/radiocaribe-logos/CAYENA.jpg" app/src/main/res/drawable-nodpi/cayena.jpg
          cp "/tmp/radiocaribe-logos/FORTALEZA.jpg" app/src/main/res/drawable-nodpi/fortaleza.jpg
          cp "/tmp/radiocaribe-logos/EL SOL.jpg" app/src/main/res/drawable-nodpi/el_sol.jpg
          cp "/tmp/radiocaribe-logos/FUEGO.jpg" app/src/main/res/drawable-nodpi/fuego.jpg

      - name: Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: radiocaribe-debug-keystore-v1

      - name: Java 11 for Android Gradle Plugin 7.4
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5.1"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RadioCaribe_v0.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioCaribe-v0.4-APK
          path: RadioCaribe_v0.4.apk
          if-no-files-found: error
